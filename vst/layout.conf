# Crate Digger MPC skin layout: the Force Shadow page (addon/shadow_page.conf),
# same MPC60-inspired td3 theme and coordinates, rebuilt as a native MPC plugin
# skin by shadow_skin.py (mpc-vst-plugins). Differences from the shadow page:
#   - no MIX TRIM / CHANNEL / OUTPUT ON / SKIPBACK: the plugin is a real MPC track
#     (mix, route and record it in MPC itself)
#   - TRANSPORT readouts: NOW PLAYING / STATUS / TIME
#   - RESULTS: 8 rows (2 x 4) with a page stepper instead of a scrolling list
style=td3
theme_bg=14161a
theme_panel=212429
theme_line=3a4049
theme_ink=e6e9ee
theme_ink_dim=8a93a0
theme_ink_faint=5d6571
theme_accent=f2b34a
theme_accent_hi=f2b34a
theme_knob_face=1b1e23
theme_knob_ring=3a4049
theme_bar=212429
theme_seg_active=f2b34a
theme_seg_inactive=1b1e23
theme_seg_active_tx=14161a
theme_btn_text=e6e9ee
theme_tab_on=f2b34a
theme_tab_on_tx=14161a
theme_lcd=0b0d10
theme_box=0b0d10
theme_btn_bg=1b1e23
theme_chrome_ink=e6e9ee
theme_knob_dot=f2b34a
theme_tile_on=2e2410
knob_look=ledring

theme_display_bg=0b0d10
theme_display_cell=15181c
theme_display_ink=f2b34a
theme_display_off=2a2f36
theme_display_bezel=3a4049
art_css=skin.css
[tab PLAY]
art file=images/chassis_play.svg x=0 y=0 w=1280 h=800
frame x=40 y=88 w=1200 h=220 title="TRANSPORT"
button cx=172 cy=169 label="◄◄" key=rewind_15 color=1b1e23
button cx=272 cy=169 label="▶ ❚❚" key=play_pause color=1c2027
button cx=372 cy=169 label="►►" key=forward_15 color=1b1e23
button cx=472 cy=169 label="■" key=stop color=1b1e23
button cx=700 cy=169 label="" key=transport_sync img=images/sync_off.png img_on=images/sync_on.png
readout w=822 h=38 cx=471 cy=256 label="NOW PLAYING" key=now_playing style=dotmatrix
readout w=170 h=38 cx=1000 cy=169 label="STATUS" key=status label_align=center
readout w=130 h=40 cx=994 cy=256 label="TIME" key=time style=dotmatrix
button cx=1120 cy=413 label="SEARCH" key=search color=1c2027

frame x=40 y=320 w=1200 h=140 title="RESULTS"
knob cx=1160 cy=194 r=28 label="GAIN" key=gain
stepper w=520 h=52 cx=322 cy=411 label="RESULTS PAGE" key=page label_align=center
readout w=410 h=38 cx=817 cy=413 label="SEARCH" key=search_status label_align=center

frame x=40 y=470 w=1200 h=240 title="RESULTS"
list x=64 y=512 w=1152 h=188 key=result cols=2 rows=4 th=44 gap=4

qlinks "PLAY" = rewind_15,play_pause,forward_15,stop,transport_sync,gain,page,search
[tab SOURCE]
art file=images/chassis_source.svg x=0 y=0 w=1280 h=800
frame x=40 y=88 w=1202 h=540 title="SOURCE"
stepper w=1000 h=64 cx=640 cy=183 label="GENRE (DISCOGS)" key=genre label_align=center
stepper w=1000 h=64 cx=640 cy=283 label="STYLE (DISCOGS, DEPENDS ON GENRE)" key=style label_align=center
stepper w=1000 h=64 cx=640 cy=383 label="SOURCE (CHANNEL, OR DECADE FOR DISCOGS)" key=decade label_align=center
stepper w=1000 h=64 cx=640 cy=483 label="REGION (DISCOGS)" key=region label_align=center
stepper w=1000 h=64 cx=640 cy=583 label="COUNTRY (DISCOGS, DEPENDS ON REGION)" key=country label_align=center
button cx=282 cy=676 label="SEARCH" key=search color=1c2027
readout w=748 h=38 cx=820 cy=676 label="STATUS" key=search_status label_align=center
qlinks "SOURCE" = genre,style,decade,region,country,search
